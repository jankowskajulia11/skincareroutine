<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Glow &amp; Care</title>
  <style>
    :root {
      --ink: #193632;
      --sage: #62796d;
      --sage-dark: #405b4f;
      --cream: #f7f5ef;
      --paper: #fffdf8;
      --muted: #66716a;
      --line: #dedfd4;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; transition: color 0.3s ease; }
    .container { width: min(1160px, calc(100% - 40px)); margin: auto; }

    /* Header & Nav */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,253,248,.95);
      border-bottom: 1px solid rgba(25,54,50,.08);
      backdrop-filter: blur(12px);
    }
    .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { font: 30px Georgia, serif; letter-spacing: -.8px; white-space: nowrap; }
    .brand small { display: block; font: 9px Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    nav { display: flex; gap: 24px; align-items: center; }
    nav a { font-size: 13px; position: relative; }
    nav a:hover { color: var(--sage); }

    /* Cart Header Button */
    .cart-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cream);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .cart-btn:hover {
      background: var(--sage-dark);
      color: white;
      border-color: var(--sage-dark);
    }
    .cart-badge {
      background: var(--sage-dark);
      color: white;
      font-size: 11px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s;
    }
    .cart-btn:hover .cart-badge {
      background: white;
      color: var(--ink);
    }

    /* Page Content */
    .page-wrapper { padding: 48px 0 80px; }
    .breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .breadcrumb a:hover { color: var(--ink); text-decoration: underline; }

    .eyebrow { color: var(--sage); font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    h1, h2, h3 { font-family: Georgia, serif; font-weight: 400; }
    
    /* Single Product Detail View */
    .product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 52px;
      align-items: center;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 44px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    .product-detail img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      border-radius: 8px;
    }
    .product-detail h1 {
      font-size: clamp(30px, 3.5vw, 40px);
      margin: 8px 0 14px;
      line-height: 1.15;
    }
    .product-detail .price {
      font-size: 24px;
      font-weight: bold;
      color: var(--ink);
      margin-bottom: 18px;
      display: block;
    }
    .product-detail p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 28px;
    }

    /* All Products Grid View */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      margin-top: 24px;
    }
    .catalog-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }
    .catalog-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(25,54,50,0.08);
    }
    .catalog-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }
    .catalog-card-body {
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .catalog-card-body h3 {
      font-size: 24px;
      margin: 6px 0 10px;
    }
    .catalog-card-body p {
      font-size: 13px;
      color: var(--muted);
      flex-grow: 1;
      margin-bottom: 20px;
    }

    /* Buttons */
    .button {
      display: inline-block;
      background: var(--sage-dark);
      color: white;
      padding: 12px 24px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid var(--sage-dark);
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
    }
    .button:hover { background: var(--ink); border-color: var(--ink); }
    .button-outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .button-outline:hover {
      background: var(--cream);
      border-color: var(--muted);
    }

    /* =========================================
       CART DRAWER & OVERLAY
       ========================================= */
    .cart-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(25, 54, 50, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .cart-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .cart-drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(440px, 100vw);
      background: var(--paper);
      box-shadow: -10px 0 35px rgba(0,0,0,0.12);
      z-index: 1001;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cart-drawer.open {
      transform: translateX(0);
    }
    .cart-header {
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .cart-header h2 {
      font-size: 22px;
      margin: 0;
    }
    .cart-close {
      background: transparent;
      border: none;
      font-size: 26px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
      padding: 4px;
      transition: color 0.2s;
    }
    .cart-close:hover { color: var(--ink); }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .empty-cart-msg {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 70px 1fr auto;
      gap: 16px;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid #eeece5;
    }
    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
    }
    .cart-item-title {
      font-weight: bold;
      font-size: 14px;
      margin: 0 0 4px;
    }
    .cart-item-price {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 8px;
    }
    .qty-controls {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: white;
    }
    .qty-btn {
      background: transparent;
      border: none;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-size: 14px;
      display: grid;
      place-items: center;
      color: var(--ink);
    }
    .qty-btn:hover { background: var(--cream); }
    .qty-count {
      padding: 0 8px;
      font-size: 12px;
      font-weight: bold;
    }
    .remove-btn {
      background: transparent;
      border: none;
      color: #993333;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .cart-footer {
      padding: 24px 28px;
      border-top: 1px solid var(--line);
      background: #fbf9f4;
    }
    .cart-subtotal {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    /* Footer */
    footer { padding: 30px 0; background: #f2f0e9; margin-top: 60px; font-size: 11px; color: var(--muted); }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; }

    @media (max-width: 800px) {
      .product-detail { grid-template-columns: 1fr; padding: 24px; gap: 28px; }
      .product-detail img { height: 280px; }
      nav a:not(.cart-btn) { display: none; }
    }
  </style>
  <script async type="text/javascript" src="//static.klaviyo.com/onsite/js/UzRTeF/klaviyo.js"></script>
</head>
<body>

  <header>
    <div class="container nav">
      <a class="brand" href="index.html">Glow &amp; Care<small>Healthy skin. Happy you.</small></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#routine">Routine</a>
        <a href="product.html" style="color: var(--sage); font-weight: bold;">Products</a>
        <a href="blog.html">Blog</a>
        <a href="information.html">Information</a>
        
        <!-- Cart Toggle Trigger -->
        <button class="cart-btn" id="open-cart-btn" aria-label="View Shopping Cart">
          Bag <span class="cart-badge" id="cart-badge">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container page-wrapper">
    <div class="breadcrumb" id="breadcrumb-area">
      <a href="index.html">Home</a> &nbsp;/&nbsp; <span>Products</span>
    </div>

    <div id="display-container">
      <!-- Injected dynamically via script -->
    </div>
  </main>

  <!-- Slide-out Cart Drawer -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <aside class="cart-drawer" id="cart-drawer" aria-label="Shopping Bag">
    <div class="cart-header">
      <h2>Your Bag</h2>
      <button class="cart-close" id="close-cart-btn" aria-label="Close cart">&times;</button>
    </div>
    
    <div class="cart-items" id="cart-items-container">
      <!-- Injected dynamically -->
    </div>

    <div class="cart-footer">
      <div class="cart-subtotal">
        <span>Subtotal</span>
        <span id="cart-subtotal-price">$0.00</span>
      </div>
      <button class="button" style="width: 100%; padding: 14px 0;" onclick="handleCheckout()">Proceed to Checkout &nbsp;→</button>
    </div>
  </aside>

  <footer>
    <div class="container footer-inner">
      <span>© Glow &amp; Care. Made with care.</span>
      <a href="index.html#contact">Contact</a>
    </div>
  </footer>

  <script>
    // Product catalog data
    const products = {
      "SERUM-001": {
        id: "SERUM-001",
        title: "Hydrating Glow Serum",
        category: "Targeted Serum",
        price: 28.00,
        image: "images/serum1.jpg",
        description: "Infused with active botanicals, this lightweight serum penetrates deeply to reinforce your moisture barrier, soothe inflammation, and restore natural luminosity without feeling greasy. Formulated for daily morning and night application across all skin types."
      },
      "CREAM-001": {
        id: "CREAM-001",
        title: "Barrier Soothing Cream",
        category: "Daily Moisture",
        price: 32.00,
        image: "images/Soothingcream.jpg",
        description: "A rich, deeply replenishing moisturizer crafted to lock in lasting hydration. Enriched with skin-identical lipids, it shields against environmental stressors, prevents trans-epidermal water loss, and provides all-day relief for sensitive or dry complexions."
      }
    };

    // Cart State Management via localStorage
    let cart = JSON.parse(localStorage.getItem('glow_cart') || '[]');

    function saveCart() {
      localStorage.setItem('glow_cart', JSON.stringify(cart));
      renderCartUI();
    }

    function openCart() {
      document.getElementById('cart-drawer').classList.add('open');
      document.getElementById('cart-overlay').classList.add('open');
    }

    function closeCart() {
      document.getElementById('cart-drawer').classList.remove('open');
      document.getElementById('cart-overlay').classList.remove('open');
    }

    function addToCart(productId) {
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.quantity += 1;
      } else {
        const product = products[productId];
        if (product) {
          cart.push({
            id: product.id,
            title: product.title,
            price: product.price,
            image: product.image,
            quantity: 1
          });
        }
      }
      saveCart();
      openCart();

      // Track 'Added to Cart' in Klaviyo
      if (window.klaviyo && products[productId]) {
        const item = products[productId];
        window.klaviyo.push(['track', 'Added to Cart', {
          ProductID: item.id,
          ProductName: item.title,
          ItemPrice: item.price,
          ImageURL: window.location.origin + '/' + item.image,
          URL: window.location.href
        }]);
      }
    }

    function updateQuantity(productId, delta) {
      const item = cart.find(i => i.id === productId);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
          cart = cart.filter(i => i.id !== productId);
        }
        saveCart();
      }
    }

    function removeFromCart(productId) {
      cart = cart.filter(i => i.id !== productId);
      saveCart();
    }

    function renderCartUI() {
      const container = document.getElementById('cart-items-container');
      const badge = document.getElementById('cart-badge');
      const subtotalEl = document.getElementById('cart-subtotal-price');

      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      badge.textContent = totalItems;
      subtotalEl.textContent = `$${totalPrice.toFixed(2)}`;

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart-msg">
            <p>Your bag is currently empty.</p>
            <button class="button button-outline" style="margin-top:10px;" onclick="closeCart()">Discover Products</button>
          </div>
        `;
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.image}" alt="${item.title}">
          <div>
            <div class="cart-item-title">${item.title}</div>
            <div class="cart-item-price">$${item.price.toFixed(2)}</div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQuantity('${item.id}', -1)" aria-label="Decrease quantity">−</button>
              <span class="qty-count">${item.quantity}</span>
              <button class="qty-btn" onclick="updateQuantity('${item.id}', 1)" aria-label="Increase quantity">+</button>
            </div>
          </div>
          <div>
            <button class="remove-btn" onclick="removeFromCart('${item.id}')">Remove</button>
          </div>
        </div>
      `).join('');
    }

    function handleCheckout() {
      if (cart.length === 0) {
        alert("Your bag is empty!");
        return;
      }
      // For GitHub Pages, redirect to contact/newsletter to complete inquiry/order
      window.location.href = "index.html#contact";
    }

    // Attach Cart Drawer event listeners
    document.getElementById('open-cart-btn').addEventListener('click', openCart);
    document.getElementById('close-cart-btn').addEventListener('click', closeCart);
    document.getElementById('cart-overlay').addEventListener('click', closeCart);

    // Dynamic Page Rendering (Single Product vs. All Products)
    const displayContainer = document.getElementById('display-container');
    const breadcrumb = document.getElementById('breadcrumb-area');
    const urlParams = new URLSearchParams(window.location.search);
    const selectedId = urlParams.get('id');

    if (selectedId && products[selectedId]) {
      // 1. Single Product Detail View
      const item = products[selectedId];
      document.title = `${item.title} — Glow & Care`;
      breadcrumb.innerHTML = `<a href="index.html">Home</a> &nbsp;/&nbsp; <a href="product.html">Products</a> &nbsp;/&nbsp; <span>${item.title}</span>`;

      displayContainer.innerHTML = `
        <article class="product-detail">
          <img src="${item.image}" alt="${item.title}">
          <div>
            <span class="eyebrow">${item.category}</span>
            <h1>${item.title}</h1>
            <span class="price">$${item.price.toFixed(2)}</span>
            <p>${item.description}</p>
            <div style="display:flex; gap:14px; flex-wrap:wrap;">
              <button class="button" onclick="addToCart('${item.id}')">Add to Bag &nbsp;→</button>
              <a class="button button-outline" href="product.html">View All Products</a>
            </div>
          </div>
        </article>
      `;

      // Track 'Viewed Product' in Klaviyo
      if (window.klaviyo) {
        window.klaviyo.push(['track', 'Viewed Product', {
          ProductID: item.id,
          ProductName: item.title,
          ItemPrice: item.price,
          ImageURL: window.location.origin + '/' + item.image,
          URL: window.location.href
        }]);
      }

    } else {
      // 2. Catalog Grid View (All Products)
      document.title = "Our Products — Glow & Care";
      displayContainer.innerHTML = `
        <div>
          <span class="eyebrow">The Collection</span>
          <h1 style="font-size:36px; margin: 8px 0 20px;">Curated Everyday Essentials</h1>
        </div>
        <div class="catalog-grid">
          ${Object.values(products).map(item => `
            <article class="catalog-card">
              <a href="product.html?id=${item.id}"><img src="${item.image}" alt="${item.title}"></a>
              <div class="catalog-card-body">
                <span class="eyebrow">${item.category}</span>
                <h3><a href="product.html?id=${item.id}">${item.title}</a></h3>
                <p>${item.description}</p>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto;">
                  <strong style="font-size:18px;">$${item.price.toFixed(2)}</strong>
                  <div style="display:flex; gap:8px;">
                    <a class="button button-outline" href="product.html?id=${item.id}" style="padding:10px 14px;">Details</a>
                    <button class="button" onclick="addToCart('${item.id}')" style="padding:10px 16px;">Add</button>
                  </div>
                </div>
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    // Initialize Cart on Load
    renderCartUI();
  </script>
</body>
</html>
